<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" /><link rel="icon" type="image/webp" href="/pension-logo.webp" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="الإدارة العامة لصندوق التقاعد الأمني" />
  <!-- Fonts loaded locally from src/assets/fonts/ -->
  <title>الإدارة العامة لصندوق التقاعد الأمني</title>
  <script>
    (function(){
      try {
        var t = localStorage.getItem('theme-storage');
        if (t) {
          var s = JSON.parse(t);
          if (s.state && s.state.isDark) document.documentElement.classList.add('dark');
        }
      } catch(e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
